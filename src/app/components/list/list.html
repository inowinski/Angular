<h2 class="list-title">Lista osób</h2>

<div class="add-button-container">
  <a
    mat-raised-button
    color="primary"
    routerLink="/add"
  >
    ➕ Dodaj osobę
  </a>
</div>

<mat-card class="list-card">

  @if (persons().length > 0) {

    <mat-list>

      @for (person of persons(); track $index) {
        <mat-list-item class="person-item">

          <span matListItemTitle>
            {{ person.firstName || 'Brak imienia' }}
            {{ person.familyName || '' }}
          </span>

          <span matListItemLine>
            ID: {{ person.id }}
          </span>

          <div class="actions">
            <a
              mat-button
              color="primary"
              [routerLink]="['/details', person.id]"
            >
              Szczegóły
            </a>

            <a
              mat-button
              color="accent"
              [routerLink]="['/edit', person.id]"
            >
              Edytuj
            </a>

            <button
              mat-stroked-button
              color="warn"
              (click)="delete(person.id!)"
            >
              Usuń
            </button>
          </div>

        </mat-list-item>
      }

    </mat-list>

  } @else {

    <mat-card-content class="empty-state">
      Brak danych.
    </mat-card-content>

  }

</mat-card>
