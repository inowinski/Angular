<h2 class="form-title">Dodaj osobę</h2>

<form class="person-form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Imię</mat-label>
    <input
      matInput
      type="text"
      [(ngModel)]="person.firstName"
      name="firstName"
      required
    >
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nazwisko</mat-label>
    <input
      matInput
      type="text"
      [(ngModel)]="person.familyName"
      name="familyName"
      required
    >
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Wiek</mat-label>
    <input
      matInput
      type="number"
      [(ngModel)]="person.age"
      name="age"
      min="0"
    >
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Miasto</mat-label>
    <input
      matInput
      type="text"
      [(ngModel)]="person.city"
      name="city"
    >
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Ulica</mat-label>
    <input
      matInput
      type="text"
      [(ngModel)]="person.street"
      name="street"
    >
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Kod pocztowy</mat-label>
    <input
      matInput
      type="text"
      [(ngModel)]="person.postCode"
      name="postCode"
      placeholder="00-000"
    >
  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    class="save-button"
    type="button"
    (click)="save()"
  >
    Zapisz
  </button>

  <input type="hidden" [(ngModel)]="person.id" name="id">

</form>
